<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>德国国旗样式文本</title>
    <style>
        .flag-strip {
            width: 300px;
            height: 100px;
            color: white;
            line-height: 100px;
            text-align: center;
            font-size: 24px;
        }
        .black { background-color: #000000; }
        .red { background-color: #DD0000; }
        .gold { background-color: #FFCE00; }
        .flag-container {
            text-align: center;
        }

        /*
           Official Ratio: 3:5 (Height : Width)
           We set a base width, and let aspect-ratio handle the height automatically.
        */
        ul.german-flag {
            list-style: none;
            padding: 0;
            margin: 0;
            width: 300px; /* Base width */
            aspect-ratio: 5 / 3; /* Enforces 3:5 Height:Width ratio */
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        /* Each stripe takes exactly 1/3 of the height */
        ul.german-flag li {
            flex: 1; /* Distributes space equally among the 3 items */
            width: 100%;
            color: #239DAD;
            text-align: center;
        }
        /* Optional: Label for clarity */
        .label {
            margin-top: 15px;
            font-family: sans-serif;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="flag-strip black">第一行文本</div>
    <div class="flag-strip red">第二行文本</div>
    <div class="flag-strip gold">第三行文本</div>


    <div class="flag-container">
        <ul class="german-flag">
            <li class="black">网页办公应用, 大陆可用</li>
            <li class="red">标记编程语言， 新质排版</li>
            <li class="gold">增量式编译器， 所见所得</li>
        </ul>
        <div class="label">Germany (3:5 Ratio)</div>
    </div>
    <div>
        <ul>
            <li><b style="background-color:#000000;color:#FFFFFF;font-size:0.8em">网页办公应用</b>，大陆可用</li>
            <li><b style="background-color:#DD0000;color:#22FFFF">标记编程语言</b>，新质排版</li>
            <li><b style="background-color:#FFCE00;color:#0031FF">增量式编译器</b>，所见所得</li>
        </ul>
    </div>
    <div>
        <ul>
            <li><b style="background-color:#000000;color:white">网页办公应用</b>，大陆可用</li>
            <li><b style="background-color:#DD0000;color:green">标记编程语言</b>，新质排版</li>
            <li><b style="background-color:#FFCE00;color:purple">增量式编译器</b>，所见所得</li>
        </ul>
    </div>
</body>
</html>
